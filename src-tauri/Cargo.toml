[package]
name = "afterdusk"
version = "0.1.0"
description = "Gestion photo open source pour photographes semi-pro"
authors = ["Lewis Bedar"]
license = "GPL-3.0-or-later"
edition = "2024"

[workspace]
members = [".", "libraw-sys"]

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "afterdusk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
afterdusk-libraw-sys = { path = "libraw-sys" }
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
thiserror = "2"
unicode-normalization = "0.1"
walkdir = "2"
xmp_toolkit = "1.12"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# LibRaw et le XMP Toolkit restent rapides même en debug.
[profile.dev.package.afterdusk-libraw-sys]
opt-level = 2

[profile.dev.package.xmp_toolkit]
opt-level = 2

# Décodage et redimensionnement d'images : trop lents sans optimisation.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
