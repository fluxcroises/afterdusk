[package]
name = "afterdusk"
version = "0.1.0"
description = "Gestion photo open source pour photographes semi-pro"
authors = ["Lewis Bedar"]
license = "GPL-3.0-or-later"
edition = "2024"

[workspace]
members = [".", "libraw-sys"]

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "afterdusk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
afterdusk-libraw-sys = { path = "libraw-sys" }
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
# Export (formats, profils ICC) : JPEG, PNG, TIFF, AVIF (sans assembleur :
# aucun outil à installer pour compiler).
jpeg-encoder = "0.7"
# Filigrane texte (police Inter, OFL, dans assets/fonts).
ab_glyph = "0.2"
moxcms = "0.8"
png = "0.18"
ravif = { version = "0.13", default-features = false, features = ["threading"] }
tiff = "0.11"
# Portage Rust de lensfun et sa base (décision 0006), version figée.
lensfun = "=0.7.0"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
thiserror = "2"
unicode-normalization = "0.1"
walkdir = "2"
xmp_toolkit = "1.12"
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "dx12", "metal", "vulkan", "std"] }
pollster = "1.0.1"
# Traces GPX (localisation, V0.3), déjà dans l'arbre des dépendances.
roxmltree = "0.20"

# HEIF par l'encodeur du système (décision 0007) : WIC sous Windows, avec les
# extensions HEIF/HEVC de Microsoft ; ImageIO sous macOS.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# LibRaw et le XMP Toolkit restent rapides même en debug.
[profile.dev.package.afterdusk-libraw-sys]
opt-level = 2

[profile.dev.package.xmp_toolkit]
opt-level = 2

# Décodage et redimensionnement d'images : trop lents sans optimisation.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
