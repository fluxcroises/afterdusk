[package]
name = "afterdusk"
version = "0.1.0"
description = "Gestion photo open source pour photographes semi-pro"
authors = ["Lewis Bedar"]
license = "GPL-3.0-or-later"
edition = "2024"

[workspace]
members = [".", "libraw-sys"]

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "afterdusk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
afterdusk-libraw-sys = { path = "libraw-sys" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# LibRaw reste rapide même en debug.
[profile.dev.package.afterdusk-libraw-sys]
opt-level = 2
