[package]
name = "afterdusk-libraw-sys"
version = "0.1.0"
description = "Liaison bas niveau vers LibRaw (compilé depuis les sources) pour Afterdusk"
license = "GPL-3.0-or-later"
edition = "2024"
links = "raw"
build = "build.rs"
include = ["build.rs", "src/**", "shim/**", "LibRaw/libraw/**", "LibRaw/internal/**", "LibRaw/src/**", "LibRaw/LICENSE.*", "LibRaw/COPYRIGHT"]

[dependencies]

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
